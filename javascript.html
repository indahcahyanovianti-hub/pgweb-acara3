<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    Nama: <i id="value_nama"></i>
    <br>
    Umur: <i id="value_umur"></i>

    <script>
        // String Variable
        var nama ="Indah Cahya";

        // Number Variables 
        let umur = 20;
        let tinggi = 160;

        // Array 
        let film_favorit = ["Harry Potter", "Enola Holmes", "Ilegal Blonde"];

        // Console Log
        console.log("Nama saya " + nama);
        console.log("Umur saya " + umur);
        console.log("Tinggi saya " + tinggi + " cm");
        console.log("Film favorit saya adalah " + film_favorit[1]);

        // Aritcmetic Operations
        let a = 132;
        let b = 4;

        let jumlah = a + b;
        console.log("Hasil penjumlahan "  + jumlah);

        let kurang = a - b;
        console.log("Hasil pengurangan "  + kurang);

        let kali = a * b;
        console.log("Hasil perkalian "  + kali);

        let bagi = a / b;
        console.log("Hasil pembagian " + bagi);

        let sisa = a % b;
        console.log("Hasil sisa pembagian " + sisa);

        let pangkat = a ** 2;
        console.log("Hasil pangkat "  + pangkat);

        // Conditional Statements
        let nilai = 85;
        if (nilai >= 90) {
            console.log("Nilai Anda A");
        } else if (nilai >= 80) {
            console.log("Nilai Anda B");
        } else if (nilai >= 70) {
            console.log("Nilai Anda C");
        } else if (nilai >= 60) {
            console.log("Nilai Anda D");
        } else {
            console.log("Nilai Anda E");
        }

        // Looping
        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }

        // Function 
        function penjumlahan(a, b) {
            return console.log("Hasil penjumlahan: " + (a + b));
        }

        penjumlahan(10, 5);

        // Menampilkan nama di halaman web (DOM)
        document.getElementById("value_nama").innerHTML = nama;
        document.getElementById("value_umur").innerHTML = umur + " tahun";

        
        
    </script>
    
</body>
</html>
