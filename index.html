<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Color</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #color_area {
            height: 400px;
            background-color: #444242;
        }

        .nama {
            animation: muncul 1.5s ease-in-out infinite alternate;
        }

        @keyframes muncul {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Area warna -->
        <div class="row">
            <div class="col" id="color_area"></div>
        </div>

        <!-- Button warna -->
        <div class="row" style="margin-top: 20px;">

            <div class="col d-grid">
                <button type="button" class="btn btn-danger" onclick="ubahwarna('red')">
                    RED
                </button>
            </div>

            <div class="col d-grid">
                <button type="button" class="btn btn-primary" onclick="ubahwarna('blue')">
                    BLUE
                </button>
            </div>

            <div class="col d-grid">
                <button type="button" class="btn btn-success" onclick="ubahwarna('green')">
                    GREEN
                </button>
            </div>

            <div class="col d-grid">
                <button type="button" class="btn btn-warning" onclick="ubahwarna('yellow')">
                    YELLOW
                </button>
            </div>

            <div class="col d-grid">
                <button type="button" class="btn btn-dark" onclick="ubahwarna('rainbow')">
                    RAINBOW
                </button>
            </div>

        </div>

        <!-- Pilih warna -->
        <div class="row" style="margin-top: 20px;">

            <div class="col">
                <input type="color" id="pilihwarna">
            </div>

            <div class="col d-grid">
                <button type="button" class="btn btn-secondary" onclick="ubahwarnabebas()">
                    UBAH WARNA
                </button>
            </div>

        </div>

        <!-- Warna pilihan otomatis -->
        <div class="row" id="daftarwarna" style="margin-top: 20px;">
        </div>

        <!-- Identitas -->
        <div class="alert alert-light text-center mt-5 nama" role="alert">
            Indah Cahya N | 25/565798/SV/26994
        </div>

    </div>

    <script>

        function ubahwarna(warna) {

            if (warna == "rainbow") {

                document.getElementById("color_area").style.background =
                    "linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)";

            } else {

                document.getElementById("color_area").style.backgroundColor = warna;

            }
        }


        function ubahwarnabebas() {

            let warna = document.getElementById("pilihwarna").value;

            document.getElementById("color_area").style.backgroundColor = warna;

            let col = document.createElement("div");
            col.className = "col d-grid";

            let tombol = document.createElement("button");
            tombol.type = "button";
            tombol.className = "btn";
            tombol.style.backgroundColor = warna;
            tombol.innerHTML = warna;

            tombol.onclick = function () {
                ubahwarna(warna);
            };

            col.appendChild(tombol);

            document.getElementById("daftarwarna").appendChild(col);
        }

    </script>

</body>

</html>
